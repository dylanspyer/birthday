<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paige and Dylan's Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="locked">
    <section class="intro">
      <h1 class="wordart">
        <span>Paige and Dylan's</span>
        <span>Birthday</span>
      </h1>
      <div class="start-row">
        <span class="unicorn flip" aria-hidden="true">🦄</span>
        <button class="start" id="start">🔊 Audio on and click here...</button>
        <span class="unicorn" aria-hidden="true">🦄</span>
      </div>
    </section>

    <section class="invitation" id="invitation">
      <a href="./media/birthday.pdf">
        <img
          src="./media/birthday.jpg"
          alt="Dylan &amp; Paige's Birthday Party: Epic water gun fight, Saturday October 24th, Butler Metro Park, 4pm. Water guns will be provided. Guests are welcome to bring their own."
          width="1000"
          height="1400"
        >
      </a>
    </section>

    <audio id="audio" src="./media/03_no.3InFMinor.mp3" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
      document.getElementById('start').addEventListener('click', () => {
        document.getElementById('audio').play().catch(() => {});
        document.body.classList.remove('locked');
        document.getElementById('invitation').scrollIntoView({ behavior: 'smooth' });
      });

      // Confetti cannons from both sides whenever the invitation scrolls into view
      function celebrate() {
        if (typeof confetti !== 'function') return;
        const end = Date.now() + 1500;
        (function frame() {
          confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, disableForReducedMotion: true });
          confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, disableForReducedMotion: true });
          if (Date.now() < end) requestAnimationFrame(frame);
        })();
      }

      new IntersectionObserver(([entry]) => {
        if (entry.isIntersecting) celebrate();
      }, { threshold: 0.5 }).observe(document.getElementById('invitation'));
    </script>
  </body>
</html>
